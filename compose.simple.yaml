services:
  mcp-web-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-web-gui
    restart: unless-stopped
    ports:
      - "5310:5310"
    environment:
      - NODE_ENV=production
      - MCP_GATEWAY_API_URL=http://mcp-backend:5311/api
      - CONFIG_PATH=/app/config/config.json
      - NEXT_PUBLIC_API_BASE_URL=http://mcp-backend:5311/api
      - API_BASE_URL=http://mcp-backend:5311/api
    volumes:
      - ./dev/data/config:/app/config
    depends_on:
      - mcp-backend
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5310"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # バックエンドAPIサービス
  mcp-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mcp-backend
    restart: unless-stopped
    ports:
      - "5311:5311"
    environment:
      - NODE_ENV=production
      - PORT=5311
      - CONFIG_PATH=/app/config/config.json
    volumes:
      - ./dev/data/config:/app/config
      # Docker socket access - fixed permissions
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5311/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MCPサーバーサービス
  mcp-simple:
    image: node:20-alpine
    container_name: mcp-simple
    restart: unless-stopped
    working_dir: /app
    command: node simple-mcp-server.js
    ports:
      - "5400:5400"
    environment:
      - PORT=5400
    volumes:
      - ./simple-mcp-server.js:/app/simple-mcp-server.js
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5400"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
    name: mcp-network
